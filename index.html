<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>手機推薦速查</title>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f3f3f5; --row:#fafafb; --info:#eef4fa;
  --ink:#333333; --muted:#6b6b72; --line:#e6e6eb;
  --accent:#c4090f; --accent-ink:#ffffff; --accent-soft:#fdf0f0;
  --good:#1e8a4c; --good-soft:#e5f5ec; --blue:#0468b6;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.brand{font-weight:800;font-size:22px;border-left:4px solid var(--accent);padding-left:10px;line-height:1.25}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.reset{flex:none;height:36px;padding:0 12px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:13px;color:var(--muted)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 40px 0 14px;font-size:16px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent)}
.search .clr{position:absolute;right:6px;top:7px;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:18px}
.sec{border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;margin-bottom:10px;background:var(--surface)}
.sec h2{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.sec h2 .no{color:var(--accent);font-weight:900}
.sec h2 small{font-weight:500;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.soft[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip small{font-weight:500;opacity:.8;margin-left:2px}
.range{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin-top:8px;font-size:13px;color:var(--muted)}
.range input{width:92px;height:36px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-size:16px;text-align:right;background:var(--surface);color:var(--ink)}
.range input:focus{outline:none;border-color:var(--accent)}
.range label{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}
.range input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
details.more summary{list-style:none;cursor:pointer;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.more[open] summary::after{content:"▴"}
details.more .grp{margin-top:10px}
details.more .grp b{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.persona-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.persona-note:empty{display:none}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.rhead b{font-size:16px}
.rhead b span{color:var(--accent)}
.rhead select{height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;font-size:16px}
.card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--surface);overflow:hidden}
.card.over{border-style:dashed}
.c-top{display:flex;gap:10px;padding:12px 12px 8px}
.rank{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.card:nth-child(-n+3) .rank{background:var(--accent);color:#fff}
.c-main{flex:1;min-width:0}
.c-name{font-weight:800;font-size:17px;line-height:1.3}
.c-sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.tagx{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tagx.b{background:var(--info);color:var(--blue)}
.tagx.g{background:var(--surface2);color:var(--muted)}
.c-price{flex:none;text-align:right}
.c-price b{display:block;color:var(--accent);font-size:19px;font-weight:900;line-height:1.2}
.c-price s{font-size:12px;color:var(--muted)}
.c-price .over-t{display:block;font-size:11px;font-weight:700;color:#a35a00}
.match{display:flex;align-items:center;gap:8px;padding:0 12px 6px;font-size:12px;color:var(--muted)}
.match i{flex:1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.match i em{display:block;height:100%;background:var(--accent);border-radius:6px}
.match span{font-weight:800;color:var(--ink);min-width:34px;text-align:right}
.reasons{margin:0;padding:4px 12px 8px 30px;font-size:14px;line-height:1.55}
.reasons li{margin:2px 0}
.reasons li b{color:var(--accent)}
.specs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.specs span{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--row);border:1px solid var(--line)}
.c-act{display:flex;border-top:1px solid var(--line)}
.c-act button,.c-act a{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.c-act > * + *{border-left:1px solid var(--line)}
.c-act button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:var(--radius)}
.more-btn{display:block;width:100%;height:44px;border-radius:var(--radius);border:1.5px solid var(--line);font-weight:700;margin-top:4px}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0))}
.cbar-in{max-width:528px;margin:0 auto;display:flex;gap:8px}
.cbar .go{flex:1;height:50px;border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:800;font-size:16px}
.cbar .go:disabled{opacity:.45}
.cbar .clr2{flex:none;height:50px;padding:0 14px;border-radius:var(--radius);background:var(--surface2);font-weight:700;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:#fff;padding:6px 0;z-index:2}
.sheet-h h3{margin:0;font-size:18px;border-left:4px solid var(--accent);padding-left:8px}
.sheet-h button{width:36px;height:36px;border-radius:10px;background:var(--surface2);font-size:18px;color:var(--muted);flex:none}
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed;min-width:320px}
table.cmp th,table.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;word-break:break-word}
table.cmp thead th{background:var(--accent);color:#fff;font-weight:800;font-size:13px}
table.cmp thead th:first-child{border-radius:10px 0 0 0}
table.cmp thead th:last-child{border-radius:0 10px 0 0}
table.cmp th.rl{width:72px;text-align:left;color:var(--muted);font-weight:700;background:var(--row);font-size:12px}
table.cmp thead th.rl{background:var(--accent);color:#fff}
table.cmp td.best{background:var(--good-soft);color:var(--good);font-weight:800}
table.cmp tr.grp td{background:var(--info);color:var(--blue);font-weight:800;text-align:left;font-size:12px}
.cmp-note{font-size:12px;color:var(--muted);margin-top:8px}
.dl{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.dl dt{background:var(--row);color:var(--muted);font-weight:700;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line)}
.dl dd{margin:0;padding:7px 8px;border-bottom:1px solid var(--line)}
.dl dt:nth-last-child(2),.dl dd:last-child{border-bottom:0}
.caps{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.caps th,.caps td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.caps th{font-size:12px;color:var(--muted);background:var(--row)}
.caps td.p{color:var(--accent);font-weight:800}
.links{display:flex;gap:8px;margin-top:12px}
.links a{flex:1;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;border:1.5px solid var(--line);color:var(--ink)}
.links a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.scorebars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:10px 0 12px}
.sb{font-size:12px;color:var(--muted)}
.sb i{display:block;height:5px;border-radius:5px;background:var(--surface2);margin-top:3px;overflow:hidden}
.sb i em{display:block;height:100%;background:var(--blue)}
.simtabs{display:flex;gap:6px;margin:0 0 10px}
.simtabs button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.simtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.base{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.base b{font-size:15px}
.base .pr{color:var(--accent);font-weight:900;white-space:nowrap}
.simnote{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.sim{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.sim-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sim-h b{font-size:15px;line-height:1.3}
.sim-h small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sim-p{text-align:right;white-space:nowrap}
.sim-p b{display:block;color:var(--accent);font-weight:900}
.pd{font-size:12px;font-weight:800}
.pd.lo{color:var(--good)}.pd.hi{color:#a35a00}.pd.eq{color:var(--muted)}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.dchips span{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px}
.dchips .up{background:var(--good-soft);color:var(--good)}
.dchips .dn{background:var(--surface2);color:var(--muted)}
.dchips .sm{background:var(--info);color:var(--blue)}
.sim-a{display:flex;gap:6px}
.sim-a button{flex:1;height:36px;border-radius:8px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.sim-a button.pri{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sheet-h .back{width:auto;padding:0 10px;font-size:14px;font-weight:700;color:var(--ink)}
.sheet-h .hl{display:flex;align-items:center;gap:8px;min-width:0}
.lvb{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;white-space:nowrap}
.lvb.l0{background:var(--surface2);color:var(--muted)}
.lvb.l1{background:var(--info);color:var(--blue)}
.lvb.l2{background:var(--good-soft);color:var(--good)}
.lvb.l3{background:var(--accent-soft);color:var(--accent)}
.lvb.le{background:var(--info);color:var(--blue)}
.lvb.lx{background:#fff;color:var(--muted);border:1px dashed var(--line)}
.qm{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--muted);flex:none;margin-left:6px;line-height:1}
.trow{padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.tname{display:flex;align-items:center;font-weight:800;font-size:14px;margin-bottom:6px}
.guide-link{margin-left:auto;font-size:13px;font-weight:800;color:var(--accent);padding:4px 2px}
.tiers{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 12px}
.tr{padding:8px 10px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr-h{display:flex;align-items:center;gap:6px}
.tr-h b{font-size:14px;margin-right:auto}
.tr-v{font-size:13px;margin-top:3px;word-break:break-word}
.tr-d{font-size:12px;color:var(--muted);margin-top:1px}
.sub-h{font-size:14px;font-weight:800;margin:12px 0 6px}
details.full summary{cursor:pointer;font-weight:800;font-size:14px;margin:10px 0 6px;color:var(--blue)}
.gnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gnav button{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--surface2)}
.gd{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.gd h4{margin:0 0 4px;font-size:16px;border-left:4px solid var(--accent);padding-left:8px}
.gd p{margin:4px 0 8px;font-size:14px}
.gd ul{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.6}
.gt{width:100%;border-collapse:collapse;font-size:13px}
.gt th,.gt td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:top}
.gt th{font-size:12px;color:var(--muted);background:var(--row)}
.cmp .lvb{white-space:normal}
.subsec{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;display:grid;gap:4px}
.ss{display:grid;grid-template-columns:76px auto 1fr;gap:6px;align-items:center;font-size:12px}
.ss-n{color:var(--muted);font-weight:700}
.ss-v{color:var(--ink);min-width:0}
.ftags{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.ftags span{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px}
.ftags .fo{background:var(--accent-soft);color:var(--accent)}
.ftags .fr{background:var(--info);color:var(--blue)}
.ftd{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.ftg{display:grid;grid-template-columns:76px 1fr;gap:6px;padding:7px 10px;border-top:1px solid var(--line);font-size:13px}
.ftg:first-child{border-top:0}
.ftg > b{color:var(--muted);font-size:12px;padding-top:2px}
.ftg > div{display:flex;flex-wrap:wrap;gap:4px}
.fi{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--row);border:1px solid var(--line)}
.fi.fr{background:var(--info);border-color:transparent;color:var(--blue);font-weight:700}
.fi.fo{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.fi i,.fc i{font-style:normal;font-size:10px;margin-left:4px;opacity:.8}
.fsrc{margin:4px 0 6px;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.6}
.fsrc a{color:var(--blue)}
.fc{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin:1px 0}
.fc.fu{color:var(--good);font-weight:800}
.fx{color:var(--line)}
.foot{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:50;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">手機推薦速查<small id="dataNote"></small></div>
    <button class="reset" id="resetBtn" type="button">全部清除</button>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="搜尋型號，例如 S26、iPhone、Reno" autocomplete="off" enterkeyhint="search">
    <button class="clr hidden" id="qClr" type="button" aria-label="清除搜尋">×</button>
  </div>

  <section class="sec">
    <h2><span class="no">01</span>預算<small>以台灣網通售價（最低容量）計算</small></h2>
    <div class="chips" id="budgetChips"></div>
    <div class="range">
      <input id="pMin" class="num" type="number" inputmode="numeric" placeholder="最低" aria-label="最低預算">～
      <input id="pMax" class="num" type="number" inputmode="numeric" placeholder="最高" aria-label="最高預算">
      <label><input id="stretch" type="checkbox">多看超出 10%</label>
    </div>
  </section>

  <section class="sec">
    <h2><span class="no">02</span>客人類型<small>選一個</small></h2>
    <div class="chips" id="personaChips"></div>
    <div class="persona-note" id="personaNote"></div>
  </section>

  <section class="sec">
    <h2><span class="no">03</span>在意的特性<small>可複選</small></h2>
    <div class="chips" id="featChips"></div>
  </section>

  <section class="sec">
    <details class="more" id="moreBox">
      <summary><span style="color:var(--accent);font-weight:900">04</span>更多條件<small id="moreCount" style="font-weight:600;color:var(--accent)"></small></summary>
      <div class="grp"><b>必備功能</b><div class="chips" id="needChips"></div></div>
      <div class="grp"><b>品牌（不選＝全部）</b><div class="chips" id="brandChips"></div></div>
      <div class="grp"><b>機型種類</b><div class="chips" id="formChips"></div></div>
      <div class="grp"><b>必備特色</b><div class="chips" id="fneedChips"></div></div>
    </details>
  </section>

  <section class="sec">
    <details class="more" id="tierBox">
      <summary><span style="color:var(--accent);font-weight:900">05</span>規格需求（分級）<small id="tierCount" style="font-weight:600;color:var(--accent)"></small></summary>
      <div style="display:flex;align-items:center;margin-top:8px"><small style="color:var(--muted)">選「≥等級」＝至少要達到</small><button type="button" class="guide-link" data-guide="bat">規格怎麼看 ›</button></div>
      <div id="tierRows"></div>
    </details>
  </section>

  <div class="rhead">
    <b>符合 <span id="cnt">0</span> 支</b>
    <select id="sortSel" aria-label="排序">
      <option value="score">推薦度</option>
      <option value="pa">價格低→高</option>
      <option value="pd">價格高→低</option>
      <option value="new">最新上市</option>
    </select>
  </div>
  <div id="list"></div>
  <button class="more-btn hidden" id="moreBtn" type="button">顯示更多</button>

  <div class="foot" id="foot"></div>
</div>

<div class="cbar hidden" id="cbar"><div class="cbar-in">
  <button class="clr2" id="cmpClear" type="button">清空</button>
  <button class="go" id="cmpGo" type="button">比較</button>
</div></div>

function weights() {
  const pn = PERSONAS.find(p => p.k === st.persona);

  if (pn && st.feats.length) { add(pn.w, .5); st.feats.forEach(k => w[k] = (w[k] || 0) + .5 / st.feats.length); }
  else if (pn) add(pn.w, 1);
  else if (st.feats.length) st.feats.forEach(k => w[k] = 1 / st.feats.length);
  else add({ perf: .3, cam: .25, bat: .25, value: .2 }, 1);
  return w;
}

  else if (st.b >= 0) { lo = BUDGETS[st.b][1]; hi = BUDGETS[st.b][2]; }

}
function compute() {
  const w = weights();

  const pn = PERSONAS.find(p => p.k === st.persona);
  const q = norm(st.q.trim());
  let res = [];
  for (const p of DATA) {
    if (q && !norm(p.name + p.brand + (p.sub || "") + p.ftxt).includes(q)) continue;
    if (st.fneeds.some(k => !hasF(p, k))) continue;
    if (lo != null && p.price < lo) continue;
    if (hi2 != null && p.price > hi2) continue;
    if (pn && pn.only && !pn.only(p)) continue;
    if (st.needs.some(k => !NEEDF[k](p))) continue;
    if (st.brands.length && !st.brands.includes(p.brand)) continue;
    if (st.form === "bar" && p.fold) continue;
    if (st.form === "foldable" && !p.fold) continue;
    if (!tierPass(p)) continue;
    let sc = 0, tw = 0;
    for (const k in w) { sc += w[k] * p.s[k]; tw += w[k]; }
    res.push({ p, score: Math.round(sc / tw), over: hi != null && p.price > hi });
  }

      <div class="c-top"><div class="rank">${i + 1}</div>
        <div class="c-main"><div class="c-name">${esc(p.name)}</div><div class="c-sub">${sub.map(esc).join("・")} ${tags}</div></div>
        <div class="c-price num"><b>${money(p.price)}</b>${p.msrp > p.price ? `<s>${money(p.msrp)}</s>` : ""}${r.over ? `<span class="over-t">超出預算</span>` : ""}</div>
      </div>
      ${`<div class="match">符合度<i><em style="width:${r.score}%"></em></i><span class="num">${r.score}</span></div>`}
      <ul class="reasons">${reasons(p, w).map(t => `<li>${t}</li>`).join("")}</ul>
      <div class="specs">${specChips(p)}</div>${ftags(p)}
      <div class="c-act">
        <button type="button" data-cmp="${p.id}" aria-pressed="${st.cmp.includes(p.id)}">${st.cmp.includes(p.id) ? "✓ 已加入比較" : "＋ 比較"}</button>
        <button type="button" data-sim="${p.id}">類似機</button>
        <button type="button" data-det="${p.id}">詳細規格</button>
      </div>
    </article>`;
  }).join("");
  $("#moreBtn").classList.toggle("hidden", res.length <= shown);
  $("#moreBtn").textContent = `顯示更多（還有 ${res.length - shown} 支）`;
}
function renderCbar() {
  const n = st.cmp.length;
  $("#cbar").classList.toggle("hidden", !n);
  $("#cmpGo").textContent = n < 2 ? `比較（已選 ${n}，再選 ${2 - n} 支）` : `比較 ${n} 支`;
  $("#cmpGo").disabled = n < 2;
}
function refresh(keepShown) { if (!keepShown) shown = 20; save(); renderControls(); renderList(); renderCbar(); }

function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}
const byId = id => DATA.find(p => p.id === id);
let sheetHist = [];
function openSheet(html) { $("#sheet").innerHTML = html; $("#sheetBg").classList.remove("hidden"); $("#sheet").scrollTop = 0; }
function closeSheet() { $("#sheetBg").classList.add("hidden"); sheetHist = []; }
function show(entry, push = true) {
  if (!push) sheetHist = [];
  sheetHist.push(entry);
  const [type, a, b] = entry;
  if (type === "det") detail(a); else if (type === "sim") similar(a, b); else if (type === "cmp") compare(); else if (type === "guide") guide(a);
}
function back() { sheetHist.pop(); const e = sheetHist.pop(); if (e) show(e); else closeSheet(); }
function head(title) {
  return `<div class="sheet-h"><div class="hl">${sheetHist.length > 1 ? `<button type="button" class="back" data-back>‹ 返回</button>` : ""}<h3>${title}</h3></div><button type="button" data-close aria-label="關閉">×</button></div>`;
}

function camLine(p) {
  const c = [p.c1, p.c2, p.c3, p.c4].filter(Boolean).map(v => v >= 10000 ? (v / 10000) + " 億" : v + " 萬");
  return c.length ? c.join("＋") : "—";
}
function detail(id) {
  const p = byId(id);
  const v = (x, u = "") => x || x === 0 ? esc(x) + u : "—";
  const rows = [
    ["處理器", `${esc(p.cpu)}（${perfLabel(p.perf)}）`], ["RAM", v(p.ram, " GB")],
    ["螢幕", `${v(p.scr, " 吋")} ${esc(p.mat || "")}`], ["更新率／亮度", `${v(p.hz, "Hz")}・${v(p.nit, " nits")}`],
    ["後鏡頭", camLine(p) + (p.ois ? "（OIS）" : "")], ["前鏡頭", p.fc ? p.fc + " 萬" : "—"],
    ["電池", p.bat ? p.bat + " mAh" : "原廠未公布"], ["快充", (p.chg ? p.chg + "W" : "—") + (p.wl ? "＋無線充電" : "")],
    ["重量／厚度", `${v(p.wt, " g")}・${v(p.th, " mm")}`], ["防水", v(p.ip)],
    ["SIM", p.esim ? "支援 eSIM" : "實體 SIM"], ["記憶卡", p.sd ? "可擴充" : "不支援"],
    ["指紋", p.fp ? esc(p.fp) : (p.brand === "Apple" ? "Face ID" : "—")], ["系統", p.os ? esc(p.os.replace(/^A/, "Android ").replace(/^i/, "iOS ")) : "—"],
    ["網路", p.g], ["上市", esc(p.date)], ["手機王標語", esc(p.sell || "—")]
  ];
  const sb = FEATS.map(([k, n]) => `<div class="sb">${n} ${p.s[k]}<i><em style="width:${p.s[k]}%"></em></i></div>`).join("");
  openSheet(`${head(esc(p.name))}
    <table class="caps"><thead><tr><th>容量</th><th>網通售價</th><th>原價</th></tr></thead><tbody>
    ${p.caps.map(c => `<tr><td>${esc(c.cap || "單一版本")}</td><td class="p num">${money(c.p)}</td><td class="num">${c.m > c.p ? `<s>${money(c.m)}</s>` : money(c.m)}</td></tr>`).join("")}
    </tbody></table>
    <div class="scorebars">${sb}</div>
    ${ftDetail(p)}
    <div class="sub-h">11 項規格解讀</div>
    <div class="tiers">${tierRows(p)}</div>
    <details class="full"><summary>完整規格表</summary>
    <dl class="dl">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></details>
    ${p.batEst ? `<p class="cmp-note">※ Apple 未公布電池容量，續航分數為同系列估計。</p>` : ""}
    ${p.missing ? `<p class="cmp-note">※ 手機王尚未提供完整規格，相機等分數暫以中間值計算。</p>` : ""}
    <div class="links"><a class="pri" href="https://ty3c.com/?p=${p.id}" target="_blank" rel="noopener">台灣網通商品頁</a><a href="https://www.sogi.com.tw/products/${esc(p.sogi)}" target="_blank" rel="noopener">手機王規格</a></div>
    <div class="links"><button type="button" class="more-btn" data-cmp="${p.id}" style="margin:0">${st.cmp.includes(p.id) ? "✓ 已加入比較" : "＋ 加入比較"}</button><button type="button" class="more-btn" data-sim="${p.id}" style="margin:0">找類似機型</button></div>`);
}

/* ---------- 類似機型 ---------- */
const SIMK = [["perf", 1.5], ["cam", 1.3], ["bat", 1], ["big", 1], ["chg", .6], ["light", .7], ["water", .5], ["disp", .7]];
const SIMW = SIMK.reduce((x, y) => x + y[1], 0);
function specDist(a, b) { let s = 0; for (const [k, w] of SIMK) { const d = a.s[k] - b.s[k]; s += w * d * d; } return Math.sqrt(s / SIMW); }
const DEFW = { perf: .3, cam: .25, bat: .25, value: .2 };
function overall(p) { let s = 0; for (const k in DEFW) s += DEFW[k] * p.s[k]; return Math.round(s); }
function simSpec(p) {
  return DATA.filter(q => q !== p && q.fold === p.fold).map(q => ({ q, d: specDist(p, q) }))
    .sort((a, b) => a.d - b.d).slice(0, 6);
}
function priceWin(p) { return [Math.round(Math.min(p.price * .85, p.price - 1500)), Math.round(Math.max(p.price * 1.15, p.price + 1500))]; }
function simPrice(p) {
  const [lo, hi] = priceWin(p);
  let c = DATA.filter(q => q !== p && q.price >= lo && q.price <= hi);
  if (c.length < 3) c = DATA.filter(q => q !== p).sort((a, b) => Math.abs(a.price - p.price) - Math.abs(b.price - p.price)).slice(0, 6);
  return c.map(q => ({ q, o: overall(q) })).sort((a, b) => b.o - a.o).slice(0, 8);
}
function diffChips(p, q) {
  const ks = FEATS.map(f => f[0]).filter(k => k !== "value");
  const d = ks.map(k => ({ k, v: q.s[k] - p.s[k] }));
  const up = d.filter(x => x.v >= 10).sort((a, b) => b.v - a.v).slice(0, 3);
  const dn = d.filter(x => x.v <= -10).sort((a, b) => a.v - b.v).slice(0, 2);
  const a = up.map(x => `<span class="up">${FNAME[x.k]} ▲${x.v}</span>`).concat(dn.map(x => `<span class="dn">${FNAME[x.k]} ▼${-x.v}</span>`));
  return a.length ? a.join("") : `<span class="sm">各項規格接近</span>`;
}
function priceDiff(p, q) {
  const d = q.price - p.price;
  if (Math.abs(d) < 300) return `<span class="pd eq">差不多價</span>`;
  return d < 0 ? `<span class="pd lo">便宜 ${money(-d)}</span>` : `<span class="pd hi">貴 ${money(d)}</span>`;
}
function similar(id, tab = "spec") {
  const p = byId(id);
  const list = tab === "spec" ? simSpec(p) : simPrice(p);
  const [lo, hi] = priceWin(p);
  const note = tab === "spec"
    ? `依效能、拍照、續航、螢幕大小、快充、重量、防水、螢幕品質找最接近的機型${p.fold ? "（只比摺疊機）" : "（只比直立機）"}；▲▼ 是和 ${esc(p.name)} 相比的分數差。`
    : `價格在 ${money(lo)}～${money(hi)} 之間（約 ±15%），依綜合分數排序；▲▼ 是和 ${esc(p.name)} 相比的分數差。`;
  const items = list.map(x => {
    const q = x.q;
    const tagx = tab === "spec" ? `相似度 ${Math.max(0, Math.round(100 - x.d))}%` : `綜合 ${x.o} 分`;
    return `<div class="sim">
      <div class="sim-h"><div><b>${esc(q.name)}</b><small>${esc(q.date)} 上市・${tagx}</small></div>
        <div class="sim-p num"><b>${money(q.price)}</b>${priceDiff(p, q)}</div></div>
      <div class="dchips">${diffChips(p, q)}</div>
      <div class="sim-a"><button type="button" class="pri" data-pair="${p.id},${q.id}">和這台比較</button><button type="button" data-det2="${q.id}">詳細規格</button></div>
    </div>`;
  }).join("");
  openSheet(`${head("類似機型")}
    <div class="base"><div><small style="color:var(--muted)">以這台為基準</small><br><b>${esc(p.name)}</b></div><span class="pr num">${money(p.price)}</span></div>
    <div class="simtabs"><button type="button" data-simtab="spec" data-id="${p.id}" aria-pressed="${tab === "spec"}">規格相近</button><button type="button" data-simtab="price" data-id="${p.id}" aria-pressed="${tab === "price"}">價格相近</button></div>
    <p class="simnote">${note}</p>${items || `<div class="empty">找不到類似機型</div>`}`);
}
function compare() {
  const ps = st.cmp.map(byId).filter(Boolean);
  const R = [
    ["g", "價格與上市"],
    ["售價", p => p.price, "min", p => money(p.price)],
    ["上市", p => p.date, null, p => esc(p.date)],
    ["g", "效能與螢幕"],
    ["處理器", p => p.perf, "max", p => `${esc(p.cpu)}<br><small>${perfLabel(p.perf)}</small>`],
    ["RAM", p => p.ram, "max", p => p.ram ? p.ram + " GB" : "—"],
    ["螢幕", p => p.scr, "max", p => `${p.scr} 吋${p.fold ? "<br><small>摺疊展開</small>" : ""}`],
    ["面板", p => p.s.disp, "max", p => `${esc(p.mat || "—")}<br><small>${p.hz || "—"}Hz${p.nit ? "・" + p.nit + " nits" : ""}</small>`],
    ["g", "相機"],
    ["後鏡頭", p => p.s.cam, "max", p => camLine(p) + (p.ois ? "<br><small>OIS 防手震</small>" : "")],
    ["前鏡頭", p => p.fc, "max", p => p.fc ? p.fc + " 萬" : "—"],
    ["g", "電池與機身"],
    ["電池", p => p.bat, "max", p => p.bat ? p.bat + " mAh" : "未公布"],
    ["快充", p => (p.chg || 0) + (p.wl ? .5 : 0), "max", p => (p.chg ? p.chg + "W" : "—") + (p.wl ? "<br><small>＋無線充</small>" : "")],
    ["重量", p => p.wt, "min", p => p.wt ? p.wt + " g" : "—"],
    ["厚度", p => p.th, "min", p => p.th ? p.th + " mm" : "—"],
    ["防水", p => p.s.water, "max", p => esc((p.ip || "—").replace(/\//g, " "))],
    ["g", "其他"],
    ["eSIM", p => p.esim, "max", p => p.esim ? "✓" : "—"],
    ["記憶卡", p => p.sd, "max", p => p.sd ? "✓" : "—"],
    ["指紋", null, null, p => esc(p.fp || (p.brand === "Apple" ? "Face ID" : "—"))],
    ["g", "特色功能（★綠色＝比較中只有這台有）"],
    ...FCATS.filter(c => ps.some(p => p.ft.some(f => f.c === c))).map(c => [c, null, null, p => ftCompare(p, ps, c)]),
    ["g", "資安強度五項"],
    ["資安強度", p => p.secS, "max", p => `<b>${p.secS} 分</b>`],
    ...SECSUB.map(u => [u.n, p => u.lv(p) ?? 1, "max", p => `${subBadge(u, p)}<br><small>${esc(u.val(p))}</small>`]),
    ["g", "11 項分級（越右邊等級越高）"],
    ...TIERS.map(t => [t.n.split("（")[0], t.mode === "eq" ? null : p => p.lv[t.k], t.mode === "eq" ? null : "max", p => `${badge(t, p)}<br><small>${esc(t.val(p))}${t.k === "chg" && p.chg ? "<br>" + chgUse(p, true) : ""}</small>`])
  ];
  const body = R.map(r => {
    if (r[0] === "g") return `<tr class="grp"><td colspan="${ps.length + 1}">${r[1]}</td></tr>`;
    const [lab, val, dir, fmt] = r;
    let best = null;
    if (dir && val) {
      const vs = ps.map(val).filter(x => x != null && x !== "" && !Number.isNaN(x));
      if (vs.length >= 2) {
        const b = dir === "max" ? Math.max(...vs) : Math.min(...vs);
        if (ps.filter(p => val(p) === b).length < ps.length) best = b;
      }
    }
    return `<tr><th class="rl">${lab}</th>${ps.map(p => `<td class="${best != null && val(p) === best ? "best" : ""}">${fmt(p)}</td>`).join("")}</tr>`;
  }).join("");
  openSheet(`${head("機型比較")}
    <div class="cmp-wrap"><table class="cmp"><thead><tr><th class="rl"></th>${ps.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="cmp-note">綠底＝這一列最好（價格、重量、厚度越低越好）。價格為台灣網通最低容量售價。</p>`);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close]");
  if (e.target.id === "sheetBg") return closeSheet();
  if (!t) return;
  const d = t.dataset;
  if ("close" in d) return closeSheet();
  if ("back" in d) return back();
  if (d.guide) { const inSheet = !$("#sheetBg").classList.contains("hidden"); return show(["guide", d.guide], inSheet); }
  if (d.goto) { const el = document.getElementById("gd-" + d.goto); if (el) { const sh = $("#sheet"); sh.scrollTop += el.getBoundingClientRect().top - sh.getBoundingClientRect().top - 64; } return; }
  if (d.tk) {
    const t = TK[d.tk], l = +d.tl;
    if (t.mode === "eq") { const a = st.tier[d.tk] || []; st.tier[d.tk] = a.includes(l) ? a.filter(x => x !== l) : [...a, l]; }
    else st.tier[d.tk] = st.tier[d.tk] === l ? null : l;
    return refresh();
  }
  if (d.sim) { const inSheet = !$("#sheetBg").classList.contains("hidden"); return show(["sim", +d.sim, "spec"], inSheet); }
  if (d.simtab) { sheetHist.pop(); return show(["sim", +d.id, d.simtab]); }
  if (d.det2) return show(["det", +d.det2]);
  if (d.pair) { st.cmp = d.pair.split(",").map(Number); save(); renderList(); renderCbar(); return show(["cmp"]); }
  if (d.b != null) { const i = +d.b; st.b = st.b === i ? -1 : i; st.min = ""; st.max = ""; return refresh(); }
  if (d.p) { st.persona = st.persona === d.p ? "" : d.p; return refresh(); }
  if (d.f) { st.feats = st.feats.includes(d.f) ? st.feats.filter(x => x !== d.f) : [...st.feats, d.f]; return refresh(); }
  if (d.fn) { st.fneeds = st.fneeds.includes(d.fn) ? st.fneeds.filter(x => x !== d.fn) : [...st.fneeds, d.fn]; return refresh(); }
  if (d.n) { st.needs = st.needs.includes(d.n) ? st.needs.filter(x => x !== d.n) : [...st.needs, d.n]; return refresh(); }
  if (d.br) { st.brands = st.brands.includes(d.br) ? st.brands.filter(x => x !== d.br) : [...st.brands, d.br]; return refresh(); }
  if (d.fm) { st.form = st.form === d.fm ? "" : d.fm; return refresh(); }
  if (d.cmp) {
    const id = +d.cmp;
    if (st.cmp.includes(id)) st.cmp = st.cmp.filter(x => x !== id);
    else if (st.cmp.length >= 3) { toast("最多比較 3 支，先取消一支"); return; }
    else st.cmp = [...st.cmp, id];
    save(); renderList(); renderCbar();
    if (!$("#sheetBg").classList.contains("hidden") && t.classList.contains("more-btn")) { sheetHist.pop(); show(["det", id]); }
    return;
  }
  if (d.det) return show(["det", +d.det], false);
});
$("#moreBtn").addEventListener("click", () => { shown += 20; renderList(); });
$("#cmpGo").addEventListener("click", () => show(["cmp"], false));
$("#cmpClear").addEventListener("click", () => { st.cmp = []; save(); renderList(); renderCbar(); });
$("#resetBtn").addEventListener("click", () => { st = def(); refresh(); window.scrollTo({ top: 0, behavior: "smooth" }); });
$("#sortSel").addEventListener("change", e => { st.sort = e.target.value; refresh(); });
let qt;
$("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value; shown = 20; save(); $("#qClr").classList.toggle("hidden", !st.q); renderList(); }, 120); });
$("#qClr").addEventListener("click", () => { st.q = ""; refresh(); $("#q").focus(); });
const onRange = () => { st.min = $("#pMin").value; st.max = $("#pMax").value; if (st.min !== "" || st.max !== "") st.b = -1; shown = 20; save(); renderControls(); renderList(); };
$("#pMin").addEventListener("change", onRange); $("#pMax").addEventListener("change", onRange);
$("#stretch").addEventListener("change", e => { st.stretch = e.target.checked; refresh(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

$("#dataNote").textContent = `${DATA.length} 支在售手機・價格 ${META.priceDate}`;
$("#foot").innerHTML = `資料來源：價格取自台灣網通價格總覽（${esc(META.priceDate)}，最低容量售價，實際以門市為準）；規格取自手機王 SOGI。符合度是依規格算出的參考分數，不代表實際體驗。`;
st.cmp = st.cmp.filter(id => byId(id));
refresh();
</script>
</body>
